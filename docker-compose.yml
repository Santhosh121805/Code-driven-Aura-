# Alternative to `python run_all.py`: the platform in one container. Real API keys come from .env (git-ignored).
services:
  plugsec:
    build: .
    ports:
      - "8000:8000"   # dashboard + API
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs   # integrations added in the UI persist on the host
      - ./data:/app/data         # SQLite database
