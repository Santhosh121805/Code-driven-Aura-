name: two_endpoint_demo
display_name: Two-endpoint demo (Mock)
enabled: true
base_url: http://127.0.0.1:8000/mock
auth:
  type: none
scopes: []
headers: {}
schedule_seconds: 900
retry:
  max_retries: 3
  backoff: exponential
  base_seconds: 1.0
  max_seconds: 30.0
rate_limit:
  min_remaining: 1
  max_wait_seconds: 120.0
  max_429_retries: 5
  min_interval_seconds: 0.0
  fallback_wait_seconds: 0.0
streams:
- name: events
  entity: event
  endpoint: /events
  method: GET
  params: {}
  headers: {}
  timeout_seconds: 15.0
  pagination:
    type: none
  records_path: results
  mapping:
    id: event_id
    type: event_type
    severity: severity
    timestamp: time
    description: message
    host: src_ip
    src_ip: src_ip
    dst_ip: src_ip
    user: user
    resource: user
  transforms:
    severity_map:
      low: low
      info: info
      medium: medium
    time_format: iso8601
    default_severity: info
  requires_env: []
  merge_into_parent: false
- name: devices
  entity: device
  endpoint: /devices
  method: GET
  params: {}
  headers: {}
  timeout_seconds: 15.0
  pagination:
    type: none
  records_path: results
  mapping:
    id: mac
    hostname: hostname
    ip: ipv4_address
    os: os_name
    owner: user
    last_seen: last_seen
  transforms:
    severity_map: {}
    time_format: iso8601
    default_severity: info
  requires_env: []
  merge_into_parent: false
secret_max_age_days: 90
alert_after_failures: 3
exfiltration_guard:
  enabled: true
  multiplier: 5.0
  min_records: 50
  baseline_runs: 10
  min_baseline_runs: 3
