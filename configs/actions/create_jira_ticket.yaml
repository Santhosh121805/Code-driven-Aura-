name: create_jira_ticket
display_name: "Create Jira ticket for high/critical alerts"
enabled: true
# Incidents only: CVE feeds (NVD, KEV) are intel, not tickets; Jira issues are never ticketed back into Jira.
# plugsec_guard = PlugSec's own alerts (token abuse on any connector, mock or real): always a ticket, one per event.
# Dependabot alerts (one per vulnerable package across every repository) are tracked on the Repositories page, not ticketed.
when: { severity_in: [high, critical], source_in: [okta, github, demo_mock, plugsec_guard], type_not_in: [dependabot_alert] }
request:
  base_url: "https://${JIRA_DOMAIN}"
  endpoint: "/rest/api/2/issue"   # v2 takes a plain-text description (v3 needs Atlassian Document Format)
  method: POST
  auth: { type: basic, username: "${jira_email}", password: "${jira_token}" }
body_template: |
  {"fields": {"project": {"key": "KAN"},
    "summary": "[{{ severity|upper }}] {{ description }}{% if host or src_ip or user %} on {{ host or src_ip or user }}{% endif %}",
    "description": "Source: {{ source }} | Type: {{ type }} | Event: {{ id }} | Time: {{ timestamp }}",
    "issuetype": {"name": "Task"}}}
dedupe_key: "{{ source }}:{{ id }}"
response_ticket_path: "key"
