# Catalog TEMPLATE (not an active integration). 'Use template' in the app copies it into the wizard.
# Facts come from the vendor docs linked below; 'verification' says how far they were confirmed.
catalog:
  name: Lacework FortiCNAPP
  category: Cloud security
  api_style: REST pull
  auth: Session login (POST /api/v2/access/tokens, X-LW-UAKS + keyId)
  paging: Next page URL in the body (paging.urls.nextPage)
  endpoint: GET /api/v2/Alerts
  docs: https://docs.fortinet.com/document/forticnapp/latest/api-reference/932048
  verification: partial
  needs:
  - session_login
  notes: Token flow from Fortinet's official reference; the Alerts path and paging from third-party docs.
template:
  name: lacework_forticnapp
  display_name: Lacework FortiCNAPP
  enabled: true
  base_url: https://${LACEWORK_ACCOUNT}.lacework.net
  auth:
    type: session_login
    login_url: /api/v2/access/tokens
    headers:
      X-LW-UAKS: ${lacework_secret}
    body:
      keyId: ${LACEWORK_KEY_ID}
      expiryTime: 3600
    token_path: token
    header: Authorization
    prefix: 'Bearer '
    ttl_seconds: 3300
  streams:
  - name: alerts
    entity: event
    endpoint: /api/v2/Alerts
    params:
      startTime: '{{ (last_sync_dt or (now_dt - days(1))).strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
      endTime: '{{ now }}'
    records_path: data
    pagination:
      type: link
      next_path: paging.urls.nextPage
      max_pages: 10
    mapping:
      id: to_string(alertId)
      type: alertType
      severity: severity
      timestamp: startTime
      description: alertName
    transforms:
      severity_map:
        Critical: critical
        High: high
        Medium: medium
        Low: low
        Info: info
  schedule_seconds: 900
