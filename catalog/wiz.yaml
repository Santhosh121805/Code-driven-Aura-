catalog:
  name: Wiz
  category: Cloud security
  api_style: GraphQL
  auth: OAuth2 client credentials (with audience)
  paging: GraphQL cursor (after / pageInfo.endCursor)
  endpoint: POST /graphql (issues query)
  docs: https://www.scribd.com/document/810029023/Using-the-Wiz-API
